syntax = "proto3";

option go_package = "inno-live-server/api/gen/aiv1;aiv1";

import "google/protobuf/empty.proto";

// Intentionally no package: existing clients call /AiProcessor/ProcessVideo.
service AiProcessor {
  // One ordered, long-lived video flow per call. A call owns its tracker state.
  rpc ProcessVideo(stream VideoChunk) returns (stream ProcessedVideoChunk);
  // Adds one face exemplar to the session-scoped in-memory whitelist.
  rpc AddWhitelist(FaceData) returns (WhitelistResponse);
  // Removes one face exemplar from a session-scoped in-memory whitelist.
  rpc DeleteWhitelist(DeleteWhitelistRequest) returns (WhitelistResponse);
  // Returns non-sensitive whitelist metadata for one session.
  rpc GetWhitelistStatus(GetWhitelistStatusRequest) returns (GetWhitelistStatusResponse);
  // Atomically creates an opaque session ID.
  rpc CreateSession(CreateSessionRequest) returns (SessionInfo);
  // Lists bounded in-memory sessions for a trusted management client.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // Deletes an idle in-memory session. Active video streams prevent deletion.
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
  // Exports one session's whitelist embeddings for a trusted worker-rollout client.
  rpc ExportWhitelist(ExportWhitelistRequest) returns (ExportWhitelistResponse);
  // Merges embeddings exported by another worker, keeping their entry IDs.
  rpc ImportWhitelist(ImportWhitelistRequest) returns (WhitelistResponse);
}

message VideoChunk {
  // One complete JPEG frame.
  bytes data = 1;
  // Opaque client value echoed in the response. Its historical unit is not fixed.
  int64 timestamp = 2;
  // Opaque client frame identifier echoed in the response.
  int64 frame_id = 3;
  // Legacy B4 scheduling hint. The B1 serving profile accepts only zero or one.
  uint32 batch_size = 4 [deprecated = true];
  // Authenticated caller session; fixed for the lifetime of one ProcessVideo RPC.
  string session_id = 5;
  // Response payload requested for this stream. Unspecified returns a server-processed JPEG.
  VideoOutputMode output_mode = 6;
  // Per-frame mosaic strength and area. Unset uses server defaults. May change mid-stream.
  MosaicConfig mosaic_config = 7;
  // Frame width in pixels. Required when data carries raw pixels (pix_fmt set); ignored for JPEG.
  uint32 width = 8;
  // Frame height in pixels. Required when data carries raw pixels (pix_fmt set); ignored for JPEG.
  uint32 height = 9;
  // Pixel format of data when it is raw (e.g. "yuv420p"). Empty means data is a self-describing JPEG.
  string pix_fmt = 10;
  // Explicit opt-in. Zero/omitted keeps Gaussian blur and loads no experimental models.
  // Fixed for the lifetime of a ProcessVideo RPC.
  FaceAnonymizationMode anonymization_mode = 11;
}

enum FaceAnonymizationMode {
  FACE_ANONYMIZATION_MODE_BLUR = 0;
  FACE_ANONYMIZATION_MODE_FACE_SWAP = 1;
  // Extract attributes and match presets, while rendering blur.
  FACE_ANONYMIZATION_MODE_FACE_METADATA = 2;
}

message FaceAttributes {
  string gender = 1;
  string age = 2;
  string glasses = 3;
  string exp = 4;
  map<string, float> confidence = 5;
}

message FaceAnonymization {
  FaceAttributes attributes = 1;
  // Stable gender/age/identity slot within one BoT-SORT track and RPC.
  string identity_key = 2;
  // Current gender/age/identity/glasses/exp variant; empty when unavailable.
  string preset_key = 3;
  // swapped, metadata_only, or blur_fallback.
  string status = 4;
  string fallback_reason = 5;
}

message MosaicConfig {
  // Gaussian blur radius in pixels; larger means a stronger blur. Valid range: (0, 64].
  optional double blur_radius = 1;
  // Mosaic block size in pixels; 1 disables pixelation. Valid range: 1..8.
  optional uint32 pixel_size = 2;
  // Outer mask margin in input-frame pixels, 0..64. Unset preserves the legacy 8px edge.
  // Zero protects the entire polygon. Larger values extend full blur with an outer fade <=8px.
  optional uint32 mask_margin = 3;
}

enum VideoOutputMode {
  VIDEO_OUTPUT_MODE_UNSPECIFIED = 0;
  VIDEO_OUTPUT_MODE_METADATA_ONLY = 1;
  VIDEO_OUTPUT_MODE_MOSAIC_JPEG = 2;
}

message ProcessedVideoChunk {
  // Server-composited JPEG. Empty only for metadata-only mode or failed frames.
  bytes data = 1;
  int64 timestamp = 2;
  string status_message = 3;
  repeated FaceMetadata faces = 4;
  int32 width = 5;
  int32 height = 6;
  int64 frame_id = 7;
  double processing_ms = 8;
  ProcessingTiming timing = 9;
  string error_code = 10;
  string error_message = 11;
  FrameStats stats = 12;
  // Transitional alias retained for wire compatibility. Servers leave this empty.
  bytes mosaic_jpeg = 13 [deprecated = true];
}

message ProcessingTiming {
  double queue_ms = 1;
  double decode_ms = 2;
  double inference_ms = 3;
  double tracking_ms = 4;
  // Server-side mask union, Gaussian blur, composition, and JPEG encoding.
  double blur_encode_ms = 5;
  uint32 inference_batch_size = 6;
  double serialize_ms = 7;
  double server_total_ms = 8;
  double runtime_total_ms = 9;
}

message Point {
  float x = 1;
  float y = 2;
}

message BoundingBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message FaceMetadata {
  BoundingBox bbox = 1;
  float confidence = 2;
  repeated Point polygon = 3;
  optional int64 track_id = 4;
  string source = 5;
  bool held = 6;
  uint32 hold_frames = 7;
  string class_name = 8;
  float mask_area_px = 9;
  bool whitelisted = 10;
  FaceAnonymization anonymization = 11;
}

message FrameStats {
  uint32 detections = 1;
  uint32 raw_detections = 2;
  uint32 continuation_candidates = 3;
  uint32 detector_backed_tracks = 4;
  uint32 low_confidence_continuations = 5;
  uint32 held_tracks = 6;
  uint32 tracks = 7;
  uint64 tracker_frame = 8;
  uint32 adaface_calls = 9;
  uint32 adaface_queue_overflow = 10;
  uint32 whitelisted_tracks = 11;
}

message FaceData {
  // Legacy message name retained for RPC path and generated-client compatibility.
  // Contains one complete JPEG, PNG, or WebP image with exactly one detectable face.
  bytes data = 1;
  string session_id = 2;
}

message WhitelistResponse {
  // Legacy fields retained for generated-client compatibility.
  string status_message = 1;
  int64 timestamp = 2;
  string entry_id = 3;
  uint32 entry_count = 4;
  uint64 whitelist_version = 5;
}

message GetWhitelistStatusRequest {
  string session_id = 1;
}

message GetWhitelistStatusResponse {
  string session_id = 1;
  uint32 entry_count = 2;
  uint64 whitelist_version = 3;
  repeated string entry_ids = 4;
}

message DeleteWhitelistRequest {
  string session_id = 1;
  string entry_id = 2;
}

// One whitelist exemplar as stored by a worker: a unit-norm AdaFace embedding.
message WhitelistEmbedding {
  string entry_id = 1;
  repeated float values = 2;
}

message ExportWhitelistRequest {
  string session_id = 1;
}

message ExportWhitelistResponse {
  string session_id = 1;
  // Identifies the recognition model that produced the embeddings. Importers reject
  // a different value because embeddings from another model are not comparable.
  string embedding_model = 2;
  repeated WhitelistEmbedding entries = 3;
  uint64 whitelist_version = 4;
}

message ImportWhitelistRequest {
  string session_id = 1;
  string embedding_model = 2;
  repeated WhitelistEmbedding entries = 3;
}

message CreateSessionRequest {}

message ListSessionsRequest {}

message DeleteSessionRequest {
  string session_id = 1;
}

message SessionInfo {
  string session_id = 1;
  uint32 entry_count = 2;
  uint64 whitelist_version = 3;
  int64 created_at_unix_ms = 4;
  uint32 active_stream_count = 5;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

// File-in/file-out VOD anonymization on the worker's already-loaded runtime.
// Live ProcessVideo frames always take precedence on the shared inference lane.
service VodProcessor {
  // Starts a new job or resumes one from its checkpoint. Returns once the job is
  // admitted (inputs probed, outputs reserved); processing continues asynchronously.
  rpc StartVodJob(StartVodJobRequest) returns (VodJobStatus);
  // Streams status: first message is the current snapshot, then progress updates.
  // Ends after a PAUSED, DONE, FAILED, or CANCELLED message. Closing it never affects the job.
  rpc WatchVodJob(VodJobRef) returns (stream VodJobStatus);
  // One-shot snapshot.
  rpc GetVodJob(VodJobRef) returns (VodJobStatus);
  // Stops GPU use within one frame, persists the last completed segment, returns PAUSED.
  rpc PauseVodJob(PauseVodJobRequest) returns (VodJobStatus);
  // Stops the job, deletes partial output; with purge_work_dir also deletes checkpoint/segments.
  rpc CancelVodJob(CancelVodJobRequest) returns (VodJobStatus);
  // Jobs known to this worker process (for server reconciliation after restarts/slot switches).
  rpc ListVodJobs(ListVodJobsRequest) returns (ListVodJobsResponse);
}

enum VodJobState {
  VOD_JOB_STATE_UNSPECIFIED = 0;
  VOD_JOB_STATE_PROCESSING = 1;
  VOD_JOB_STATE_PAUSED = 2;
  VOD_JOB_STATE_DONE = 3;
  VOD_JOB_STATE_FAILED = 4;
  VOD_JOB_STATE_CANCELLED = 5;
}

enum VodQuality {
  // Mode A: one pass, live-parity pipeline (detection→tracking→recognition→mosaic).
  VOD_QUALITY_STANDARD = 0;
  // Mode B (high precision: lookahead/backfill, multi-pass). Rejected with
  // FAILED_PRECONDITION until implemented; field reserved now so the server need not change.
  VOD_QUALITY_HIGH = 1;
}

enum VodPauseReason {
  VOD_PAUSE_REASON_UNSPECIFIED = 0;
  VOD_PAUSE_REASON_REQUESTED = 1;        // server PauseVodJob (e.g. live demand)
  VOD_PAUSE_REASON_WORKER_DRAINING = 2;  // set_accepting(False) / rolling replace / SIGTERM
  VOD_PAUSE_REASON_RUNTIME_RECOVERY = 3; // worker entered runtime recovery
}

message VodWhitelist {
  // Must equal ExportWhitelistResponse.embedding_model of this worker, else EMBEDDING_MODEL_MISMATCH.
  string embedding_model = 1;
  repeated WhitelistEmbedding entries = 2;   // existing message; unit-norm AdaFace vectors
}

message VodOutputOptions {
  // "auto" (h264_nvenc when available, else libx264), "h264_nvenc", "libx264".
  string video_encoder = 1;
  // Constant-quality target: NVENC -cq / x264 -crf. 0 = default (20).
  uint32 quality = 2;
  // Re-encode audio to AAC even when stream copy is possible.
  bool force_audio_aac = 3;
}

message StartVodJobRequest {
  // Server-generated stable ID (UUID). Same ID across pause/resume and across workers.
  string job_id = 1;
  // Absolute paths under the worker's --vod-root (shared local disk). Symlinks resolved; outside root → rejected.
  string input_path = 2;
  string output_path = 3;     // final file, written as <output_path>.part then renamed atomically on DONE
  string work_dir = 4;        // checkpoint.json + segments/; created if absent
  // Registered-person exclusion. Empty entries = protect everyone.
  oneof whitelist_source {
    VodWhitelist whitelist = 5;          // preferred: server ExportWhitelist()s the user's session from any worker
    string whitelist_session_id = 6;     // convenience: a session already on THIS worker; snapshot taken at start
  }
  VodQuality quality = 7;
  MosaicConfig mosaic_config = 8;        // existing message; fixed for the job
  FaceAnonymizationMode anonymization_mode = 9; // v1 accepts BLUR only; others → FAILED_PRECONDITION
  VodOutputOptions output = 10;
  // false = new job (work_dir must have no checkpoint, output must not exist unless overwrite_output).
  // true  = resume from work_dir/checkpoint.json; checkpoint_token must match.
  bool resume = 11;
  string checkpoint_token = 12;
  bool overwrite_output = 13;
  // Segment length in source frames at which checkpoints are cut. 0 = default 300.
  uint32 segment_frames = 14;
}

message VodJobRef {
  string job_id = 1;
}

message PauseVodJobRequest {
  string job_id = 1;
}

message CancelVodJobRequest {
  string job_id = 1;
  bool purge_work_dir = 2;
}

message ListVodJobsRequest {}

message ListVodJobsResponse {
  repeated VodJobStatus jobs = 1;
}

message VodProgress {
  uint64 frames_done = 1;          // source frames fully processed and committed or in the current segment
  uint64 frames_total = 2;         // from ffprobe nb_frames, else round(duration × avg_frame_rate)
  bool frames_total_estimated = 3; // true when nb_frames was absent
  double fraction = 4;             // frames_done / frames_total, clamped to [0,1]; 1.0 only at DONE
  uint32 segments_done = 5;
  uint32 segments_total = 6;
  double processing_fps = 7;       // EWMA over the last ~10 s of active processing
  double eta_seconds = 8;          // (frames_total-frames_done)/processing_fps; -1 if unknown
}

message VodJobStatus {
  string job_id = 1;
  VodJobState state = 2;
  VodProgress progress = 3;
  // Opaque token naming the last durable checkpoint (empty before the first segment commits).
  // Pass back in StartVodJobRequest.checkpoint_token to resume.
  string checkpoint_token = 4;
  VodPauseReason pause_reason = 5;
  string error_code = 6;       // §6, set for FAILED (and CANCELLED = "CANCELLED")
  string error_message = 7;
  string output_path = 8;      // set at DONE
  int64 updated_at_unix_ms = 9;
  // Source facts from probe (set from admission onward).
  uint32 width = 10;
  uint32 height = 11;
  double avg_frame_rate = 12;
  double duration_seconds = 13;
  bool has_audio = 14;
  uint64 input_size_bytes = 16; // stat size at admission, checked against --vod-max-input-bytes
  string worker_target = 15;   // host:port this worker listens on, for server bookkeeping
}
