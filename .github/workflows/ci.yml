name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_pw
          POSTGRES_DB: innolive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d innolive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg
        timeout-minutes: 10

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://ci_user:ci_only_pw@localhost:5432/innolive_ci?sslmode=disable
        run: go test ./...

  race-test:
    name: race-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        uses: ./.github/actions/install-ffmpeg
        timeout-minutes: 10

      - name: Race test (excluding known flaky)
        run: go test -race -skip 'TestBypassWebRTCEndToEnd' ./...

      - name: Race test (flaky, isolated with retries)
        run: |
          for attempt in 1 2 3; do
            if go test -race -run 'TestBypassWebRTCEndToEnd' -p 1 -count 1 ./internal/server; then
              exit 0
            fi
            echo "attempt ${attempt} failed"
          done
          exit 1
