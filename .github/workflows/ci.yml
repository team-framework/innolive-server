name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI 러너 안에서만 쓰는 더미 자격증명 — 실제 환경과 무관한 값이어야 한다.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_pw
          POSTGRES_DB: innolive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d innolive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ffmpeg가 없으면 media 계열 테스트가 대부분 skip되므로 설치해서 실제로 돌린다.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://ci_user:ci_only_pw@localhost:5432/innolive_ci?sslmode=disable
        run: go test ./...

  # 동시성 코드(media/session) 회귀를 잡는 race 검사. 필수 검사에는 넣지 않는 참고용 잡 —
  # 안정성이 확인되면 required 승격을 검토한다.
  race-test:
    name: race-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # TestBypassWebRTCEndToEnd는 병렬 실행에서 간헐 실패하는 알려진 flaky라 분리한다.
      - name: Race test (excluding known flaky)
        run: go test -race -skip 'TestBypassWebRTCEndToEnd' ./...

      # flaky 테스트는 격리(-p 1) + 최대 3회 재시도로 따로 검증한다.
      - name: Race test (flaky, isolated with retries)
        run: |
          for attempt in 1 2 3; do
            if go test -race -run 'TestBypassWebRTCEndToEnd' -p 1 -count 1 ./internal/server; then
              exit 0
            fi
            echo "attempt ${attempt} failed"
          done
          exit 1
