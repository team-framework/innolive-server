name: OAuth domain association

on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/oauth/**'
      - '.github/workflows/oauth-association.yml'

permissions:
  contents: read

jobs:
  caddy-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Caddy
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' \
            '8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9' \
            "$RUNNER_TEMP/caddy.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: Test AASA, callback routing and log privacy
        env:
          CADDY_BIN: ${{ runner.temp }}/caddy
        run: python3 deploy/oauth/test_routes.py
