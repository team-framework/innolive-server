openapi: 3.0.3
info:
  title: InnoLive VOD 작업 API
  version: 0.2.0
  description: |
    # 범위와 근거

    이슈 #521의 API 계약이다. 2단계에서 기본 비활성 VOD 기능을 구현한다. 서버의 기존 HTTP 주소 체계에
    맞춰 초안의 `/api/v1/vod/jobs`를 `/vod/jobs`로 확정한다. `/api/v1` 별칭이나
    프록시 rewrite는 정의하지 않는다. JSON 필드는 snake_case이고 성공 응답은
    data/success 래퍼 없이 반환한다. 기존 OpenAPI 문서가 없어 api/ 아래에 추가한다.

    근거(작성 시점 소스):
    - internal/server/server.go:112-143: net/http ServeMux, 접두사 없는 리소스 경로와 RequireUser 래핑.
    - internal/auth/user_middleware.go:52-79,117-149: 활성 사용자 Bearer 인증, 컨텍스트 UUID, 인증 오류 형식.
    - internal/server/server.go:1470-1479,1535-1581: X-Request-ID, error 래퍼, 선택적 details와 request_id, 직접 JSON 응답.
    - internal/server/reference_face.go:138-153,301-329: snake_case, time.Time, multipart 업로드와 본문 크기 제한.
    - internal/server/server.go:1499-1529: Origin 허용 목록과 OPTIONS/CORS 처리.
    - internal/server/session_auth.go:44-62: 기존 세션 소유권 검증. VOD는 사용자 UUID만 사용하며 세션 owner token은 요구하지 않는다.
    - internal/ai/pool.go:155-173: 라이브 스트림 워커 배정. VOD 작업 큐나 체크포인트 구현은 아님.
    - api/proto/ai_processor.proto:6-26 및 읽기 전용 innolive-ai/protos/ai_processor.proto:6-25: 프레임 스트림 RPC, VOD 작업 RPC 없음.
    - /workspace/innolive-video/plan.md §3.2-0, §3.2-1, §3.5: 기존 AI 워커 재사용, 신규 작업 큐, 라이브 우선.
    - https://github.com/team-framework/innolive-server/issues/521: 로컬 디스크 저장, 실패·취소를 포함한 원본 파기 기한.

    인증은 기존 로그인에서 발급한 InnoLive access token을 사용한다. 모든 작업 조회,
    다운로드, 삭제는 인증 컨텍스트의 user_id와 job_id를 함께 조건으로 적용한다.
    요청에 user_id를 받지 않으며 세션 토큰, 게스트 쿠키, 외부 OAuth 토큰은 대체할 수 없다.
    목록에는 본인 작업만 포함한다. 타인 작업과 없는 작업은 모두 404/not_found로 응답한다.
    이는 기존 세션의 소유권 불일치 403과 달리 VOD 작업 존재 여부도 감추기 위한 선택이다.
    작업 식별자의 UUID 문법 오류는 400이며 인증 검증을 먼저 수행한다.

    # 업로드와 설정 계약

    multipart/form-data의 `file` 파트 하나만 허용한다. 빈 파일, 여러 파일, 중복 file,
    알 수 없는 파트는 400/bad_request이다. 파일 이름은 표시 용도로만 사용하며 경로나
    작업 식별자로 사용하지 않는다. 브라우저가 multipart boundary를 생성해야 한다.
    MVP 입력은 MP4 컨테이너의 H.264 영상과 AAC 오디오(또는 무음)이다. 파일 파트의
    Content-Type은 video/mp4 또는 application/octet-stream을 허용하되 실제 바이트를
    검사한다. 지원하지 않는 컨테이너/코덱은 415/unsupported_media_type,
    손상되거나 영상 트랙·유효한 길이가 없는 파일은 422/invalid_media이다.
    결과는 MP4/H.264이며 AAC 오디오는 무변환 복사한다. 확장자나 MIME만 신뢰하지 않는다.

    다음 이름은 서버 설정 계약이다. VOD_ENABLED=false가 기본이며 꺼져 있으면 라우트와 백그라운드 작업을 등록하지 않는다.
    - VOD_MAX_UPLOAD_BYTES: 파일 바이트 상한 M, 양의 정수. 파일 크기는 M 이하.
    - VOD_MAX_DURATION_SEC: 서버가 조사한 영상 길이 상한 D, 양의 정수 초. 0 < 길이 <= D.
    - 전체 multipart 본문 상한: M + 1048576 바이트(파트 헤더/boundary 여유 포함).
      Content-Length 유무와 관계없이 실제 스트림에서 두 상한을 검사한다.
    - VOD_ORIGINAL_RETENTION_SEC: 종료 후 원본 보존 상한, 정수 0..86400초, 기본 86400.
      0은 종료 직후 파기이다. 스위퍼 주기를 더해 기한을 넘겨서는 안 된다.
    - VOD_RESULT_RETENTION_SEC: 성공 완료 후 결과 보존 기간, 양의 정수 초.
      무기한 보관이나 다운로드 시 기한 연장은 허용하지 않는다.
    기본값은 M=2147483648(2 GiB), D=3600(60분), 결과 보존 기간=604800초(7일)이다.
    상한 초과 오류 응답의 details에 적용 상한(max_upload_bytes, max_request_bytes,
    max_duration_sec)을 담는다. 설정 변경은 이미 확정된 삭제/만료 기한을 연장하지 않는다.
    업로드 읽기 기한은 전역 WebSocket/SSE timeout과 분리하며 실제 값은 구현 단계에서 결정한다.

    POST는 파일 수신·미디어 검증·원본 및 작업의 영속 저장이 끝난 뒤 201을 반환한다.
    실패한 업로드는 사용자에게 보이는 작업을 만들지 않고 임시 파일을 정리한다.
    201 시점에는 uploaded 또는 queued이며 처리 완료를 기다리지 않는다.
    uploaded는 업로드 중이라는 뜻이 아니라 스케줄러 전달 전이라는 뜻이다.
    작업 수락 후 일시적인 큐 장애는 uploaded 상태에서 재시도한다. 영속 수락 불가는
    503/service_unavailable이다. 라이브가 바쁘다는 이유만으로 업로드를 거절하지 않는다.
    POST의 멱등성 키/재개 업로드는 이번 계약에 없다. 응답 유실 후 재전송은 새 작업이므로
    클라이언트는 목록을 먼저 확인하고 자동 재업로드하지 않는다.

    # 상태와 진행률

    | 현재 | 다음 | 조건 |
    | --- | --- | --- |
    | uploaded | queued, failed, cancelled | 큐 등록 성공 또는 복구 불가 오류 |
    | queued | processing, failed, cancelled | 라이브가 쓰지 않는 워커/GPU 확보 또는 복구 불가 오류 |
    | processing | paused, done, failed, cancelled | 라이브 양보/지연 가드/일시적 워커 장애, 결과 저장 완료, 복구 불가 오류 |
    | paused | queued, failed, cancelled | 재개 가능하여 기존 순번으로 복귀 또는 복구 불가 오류 |
    | done | expired | result_expires_at 도달 |
    | failed, cancelled, expired | 없음 | 재실행은 새 업로드 |

    어느 상태에서도 DELETE는 취소와 논리 삭제를 수행한다. 삭제된 작업은 목록에서
    빠지고 상세/결과는 404이다. 삭제 요청은 내부 cancelled로 기록하고 공개 tombstone은 추가하지 않는다. 워커 자체 취소는 cancelled로 공개하며 원본 파기 의무는 failed와 같다.
    서버 내부에서는 취소 시각과 정리 의무를 보존하며 늦게 도착한 워커 결과가 작업을
    되살릴 수 없다. 반복 DELETE는 404이지만 삭제 효과는 멱등이다.

    라이브가 항상 우선이다. 유휴 자원에서만 VOD를 실행하고, GPU당 최대 1개 작업을
    배정한다(초기 정책, 실측 후 조정 가능). 라이브 수요/지연 가드 발생 시 새 구간을
    시작하지 않고 자원을 양보한다. 구간 체크포인트부터 재개하며 중단된 미확정 구간은
    다시 처리할 수 있다. 라이브를 장시간 구간 완료까지 기다리게 해서는 안 된다.
    사용자 pause/resume API는 없다. paused는 서버 스케줄러가 관리한다.

    VOD 간 순서는 최초 큐 진입 시각과 job_id의 오름차순(FIFO)이며 재개 시 순서를
    유지한다. queue_position은 전체 VOD 대기열(queued와 paused)의 1부터 시작하는
    순번이다. 다른 사용자의 ID/파일명은 노출하지 않는다. 라이브는 이 순번에 포함하지
    않으며 모든 VOD보다 우선한다. 자원 상태에 따라 실제 시작 순서는 달라질 수 있다.
    큐 스냅샷을 얻지 못하면 queue_position은 null이다.
    eta_sec는 현재부터 결과 완료까지의 추정 초(대기 + 남은 처리/결과 저장)이다.
    라이브 부하에 따라 늘거나 줄며 보장 시간이 아니다. 예측 불가 시 null이다.
    라이브 장기 점유로 대기/일시정지가 무기한 길어질 수 있으며 종료 전 24시간 삭제
    타이머는 시작하지 않는다. 최대 대기/처리 시간 정책은 별도 운영 결정이다.

    progress는 업로드 전송률과 별개인 0..100 정수 백분율이다. 확정 체크포인트의
    처리량 기준으로 단조 증가하고 재처리/일시정지 시 감소하지 않는다. uploaded/queued의
    최초 값은 0이며, 재개 대기 시 기존 값을 유지한다. 결과가 영속 저장되기 전 최대 99,
    done/expired는 100, failed는 마지막 값이다. 목록/상세를 5초 간격으로 폴링한다.
    상태 변화가 빠르면 중간 상태를 관찰하지 못할 수 있다.

    # 보존과 시간

    모든 *_at은 UTC RFC 3339 문자열(Z, 소수 초 허용)이다. created_at/updated_at은
    항상 문자열이고 종료/삭제/만료 시각은 미정이면 명시적인 null이다. 필드를 생략하지
    않는다. null은 아직 정해지지 않았음을 뜻하며 무기한 보관 허가가 아니다.
    completed_at은 done, failed 또는 cancelled 진입 시각이고 expired에서도 유지한다.
    original_delete_at은 completed_at + VOD_ORIGINAL_RETENTION_SEC 이하의 파기 기한이다.
    실제 파기가 빨리 끝나도 기한 필드와 작업 상태는 유지한다(파기 완료 표시가 아님).
    실패도 동일하게 적용한다. DELETE 시 원본 파기 기한은 기존 기한과 삭제 수락 시각
    + 보존 상한 중 더 이른 값이며 결과·임시 파일도 삭제 수락 후 24시간 이내 정리한다.
    DELETE 204는 접근 차단과 취소/정리 의무의 영속화를 뜻하며 물리 파기 완료를 뜻하지 않는다.
    원본 복사본과 중간 체크포인트 정리는 원본 기한을 따르고 파기 로그를 남겨야 한다.

    result_expires_at은 done 진입 시 completed_at + VOD_RESULT_RETENTION_SEC로 고정한다.
    해당 시각까지 결과 파일을 파기한다. 해당 시각부터 신규 다운로드는
    410/result_expired이며 정리 스위퍼 실행 여부와 무관하게 접근을 차단한다.
    만료 전 시작한 다운로드도 만료 또는 DELETE 시 중단한다. expired 작업의 메타데이터는
    사용자가 DELETE할 때까지 목록/상세에 남으며 원본 삭제만으로 expired가 되지 않는다.
    실패 작업의 result_expires_at은 null이다. 완료되지 않은/부분 결과나 원본은 다운로드할 수 없다.

    # HTTP 공통 규칙과 다운로드

    정상 API 및 오류 응답은 Cache-Control: no-store와 X-Request-ID를 반환한다.
    X-Request-ID 요청 헤더는 기존 미들웨어가 그대로 전달하거나 생성한다.
    error.message는 표시용이며 분기는 HTTP 상태와 error.code로 수행한다.
    request_id와 error.details는 선택적이다. 기존 인증 미들웨어의 오류에는 request_id가 없다.
    정의한 작업 API 오류는 JSON이며, 미등록 경로/미지원 메서드는 기존 ServeMux의
    404/405 text/plain 동작을 유지한다. 클라이언트는 비JSON 프록시 오류도 처리해야 한다.

    GET result는 인증 후 파일 바이트를 직접 반환한다. URL JSON이나 외부 저장소로의
    리다이렉트는 없다. Content-Disposition은 attachment이고 다운로드 이름은 서버가
    생성한 ASCII `vod-{job_id}.mp4`이다. 원본 파일명을 헤더에 사용하지 않는다.
    Content-Length는 실제 결과 바이트 수, Content-Type은 video/mp4,
    X-Content-Type-Options는 nosniff, Accept-Ranges는 none이다.
    이번 계약에는 부분 다운로드가 없으며 Range 헤더를 보내도 전체 파일의 200을 반환한다.
    스트림 시작 이후 저장소 오류가 나면 연결을 중단하며 JSON 오류를 파일 뒤에 쓰지 않는다.

    랜딩 웹의 Origin은 기존 허용 목록에 등록해야 한다. 기존 OPTIONS/CORS 처리를 재사용하고
    Authorization, Content-Type, X-Request-ID 요청 헤더를 허용한다. 브라우저가 읽을 수
    있도록 X-Request-ID 외에 Location, Content-Disposition, Content-Length, Retry-After를
    노출해야 한다(현재는 X-Request-ID만 노출하므로 구현 단계 변경 필요).
    토큰을 URL query에 넣지 않는다. 다운로드도 Authorization 헤더가 있는 요청이어야 한다.

    # TypeScript 클라이언트 타입 예시

    아래는 wire 형식 예시이며 생성된 SDK가 아니다. 날짜 문자열은 클라이언트에서 파싱한다.

    ```ts
    type VodJobStatus =
      | 'uploaded' | 'queued' | 'processing' | 'paused'
      | 'done' | 'failed' | 'cancelled' | 'expired';
    type VodFailureCode = 'processing_failed' | 'storage_failed';
    interface VodJob {
      job_id: string;
      status: VodJobStatus;
      progress: number;
      queue_position: number | null;
      eta_sec: number | null;
      created_at: string;
      updated_at: string;
      completed_at: string | null;
      original_delete_at: string | null;
      result_expires_at: string | null;
      failure: { code: VodFailureCode; message: string } | null;
    }
    interface VodJobList { jobs: VodJob[]; next_cursor: string | null }
    interface VodListQuery { limit?: number; cursor?: string }
    interface VodUpload { file: File }
    interface ApiError {
      error: { code: string; message: string; details?: Record<string, unknown> };
      request_id?: string;
    }
    // wire의 snake_case 유지. camelCase 변환은 UI 계층에서 처리한다.
    async function uploadVod(baseURL: string, accessToken: string, file: File): Promise<VodJob> {
      const body = new FormData();
      body.append('file', file);
      const response = await fetch(`${baseURL}/vod/jobs`, {
        method: 'POST', headers: { Authorization: `Bearer ${accessToken}` }, body,
      });
      // Content-Type은 직접 설정하지 않는다. 브라우저가 boundary를 붙인다.
      if (!response.ok) throw new Error(`VOD upload failed: ${response.status}`);
      return await response.json() as VodJob;
    }
    // GET /vod/jobs -> VodJobList, GET /vod/jobs/{job_id} -> VodJob
    // GET /vod/jobs/{job_id}/result -> binary stream (small files may use Blob)
    // DELETE /vod/jobs/{job_id} -> 204, body 없음
    ```

    # 남은 운영·구현 결정

    - 업로드 읽기 기한은 30분이며 VOD_UPLOAD_TIMEOUT으로 변경 가능.
    - 이슈에서 정한 로컬 디스크의 경로·용량·스위퍼 주기와 실패 재시도/파기 로그 운영 방식.
    - AI 인터페이스는 interface-A.md의 VodProcessor RPC 계약 사용. GPU 매핑·메모리 임계값과 ETA 실측은 배포 전 확인 필요.
    - 장기 대기/실패 메타데이터의 보관 상한과 계정 탈퇴 시 정리 연결(접근은 기존 인증에서 차단).
    이 문서는 구현, 운영 검증, 배포를 완료했다는 의미가 아니다.
servers:
  - url: /
    description: 기존 InnoLive HTTP 서버 origin
security:
  - bearerAuth: []
tags:
  - name: VOD
    description: 로그인 사용자별 VOD 비식별 작업
paths:
  /vod/jobs:
    post:
      tags: [VOD]
      operationId: createVodJob
      summary: 영상 업로드 및 작업 생성
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 파일 하나, 0 < 바이트 수 <= VOD_MAX_UPLOAD_BYTES. 길이 <= VOD_MAX_DURATION_SEC.
            encoding:
              file:
                contentType: video/mp4, application/octet-stream
      responses:
        '201':
          description: 업로드 검증과 영속 저장 완료. status는 uploaded 또는 queued.
          headers:
            Location:
              description: 생성한 작업의 상대 경로 /vod/jobs/{job_id}
              schema:
                type: string
                example: /vod/jobs/8f46f610-3207-4b86-8a22-18a1eeefb781
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '409':
          $ref: '#/components/responses/WithdrawalInProgress'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/InvalidMedia'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [VOD]
      operationId: listVodJobs
      summary: 본인 작업 목록 조회
      description: |
        created_at DESC, job_id DESC 순서의 커서 페이지네이션. 삭제된 작업은 제외하고
        failed/expired는 포함한다. 첫 페이지의 상한과 마지막 정렬 키를 담은 opaque cursor로
        다음 페이지를 조회하여 페이지 이동 중 추가된 작업이 끼어들지 않도록 한다.
        cursor는 사용자에 바인딩하며 다른 사용자/변조/문법 오류 cursor는 400/bad_request이다.
        상태/진행률은 각 요청 시점의 값이며 고정 스냅샷이 아니다. 삭제된 항목은 건너뛴다.
        마지막 페이지는 next_cursor=null, 빈 목록은 jobs=[]이다. total은 제공하지 않는다.
        저장소에 기존 페이지네이션 규칙이 없어 이 API에 명시적으로 도입한다.
      parameters:
        - name: limit
          in: query
          description: 페이지 크기. 정수가 아니거나 범위 밖이면 400이며 자동 보정하지 않는다.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: 직전 응답의 next_cursor. 첫 요청에서는 생략하며 빈 문자열은 허용하지 않는다.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 본인 작업 페이지
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VodJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /vod/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      tags: [VOD]
      operationId: getVodJob
      summary: 본인 작업 상태 조회
      description: expired/failed도 200으로 조회 가능하다. 원본 파일이나 저장소 경로는 노출하지 않는다.
      responses:
        '200':
          $ref: '#/components/responses/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [VOD]
      operationId: deleteVodJob
      summary: 본인 작업 취소 및 삭제
      description: |
        모든 상태에서 허용한다. 접근 차단, 스케줄링 취소, 파기 의무를 영속화한 뒤 204.
        파일의 물리 파기는 비동기이며 기한은 공통 보존 계약을 따른다.
        삭제 후 GET/다운로드/반복 DELETE는 404. 요청 본문은 없다.
      responses:
        '204':
          description: 논리 삭제 완료. 응답 본문 없음.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/WithdrawalInProgress'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /vod/jobs/{job_id}/result:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      tags: [VOD]
      operationId: downloadVodResult
      summary: 비식별 결과 파일 다운로드
      description: |
        본인 소유이며 done이고 현재 시각 < result_expires_at인 작업만 다운로드 가능하다.
        uploaded/queued/processing/paused/failed/cancelled는 409/result_not_ready,
        expired 또는 만료 시각 경과는 410/result_expired이다.
        타인 작업/삭제된 작업/없는 작업은 상태보다 먼저 판정하여 404이다.
        만료 전 파일을 일시적으로 읽을 수 없으면 503/service_unavailable이며 원본으로 대체하지 않는다.
      responses:
        '200':
          description: 전체 결과 MP4 바이너리 스트림
          headers:
            Content-Disposition:
              description: 서버 생성 ASCII 파일명, 원본 파일명 미사용.
              schema:
                type: string
                example: attachment; filename="vod-8f46f610-3207-4b86-8a22-18a1eeefb781.mp4"
            Content-Length:
              description: 결과 파일의 실제 바이트 수
              schema:
                type: integer
                format: int64
                minimum: 1
            Accept-Ranges:
              schema:
                type: string
                enum: [none]
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenOrigin'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResultNotReady'
        '410':
          $ref: '#/components/responses/ResultExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 기존 InnoLive 로그인 access token. RequireUser로 활성 사용자 확인.
  parameters:
    JobID:
      name: job_id
      in: path
      required: true
      description: 서버가 발급한 작업 UUID. 문법 오류는 400, 본인 작업이 아니거나 없으면 404.
      schema:
        type: string
        format: uuid
  headers:
    RequestID:
      description: 요청의 X-Request-ID 또는 서버 생성값
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: 재시도까지 기다릴 양의 정수 초. 429에는 필수, 일시적 503에는 제공 가능.
      schema:
        type: integer
        minimum: 1
  schemas:
    VodJobStatus:
      type: string
      enum: [uploaded, queued, processing, paused, done, failed, cancelled, expired]
    VodJob:
      type: object
      required:
        - job_id
        - status
        - progress
        - queue_position
        - eta_sec
        - created_at
        - updated_at
        - completed_at
        - original_delete_at
        - result_expires_at
        - failure
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VodJobStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 확정 처리 진행률 %. 업로드 전송률과 별개이며 done/expired만 100.
        queue_position:
          type: integer
          minimum: 1
          nullable: true
          description: queued/paused의 전체 VOD 대기 순번. 다른 상태 또는 큐 조회 불가 시 null.
        eta_sec:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: 결과 완료까지 추정 초. uploaded/failed/expired 및 예측 불가 시 null, done은 0.
        created_at:
          type: string
          format: date-time
          description: 업로드 수락 시각. UTC RFC 3339.
        updated_at:
          type: string
          format: date-time
          description: 영속 작업 상태/진행률/기한의 마지막 변경 시각. 실시간 순번/ETA 변화는 제외.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: done/failed 진입 시각. expired에서 유지. 종료 전 null.
        original_delete_at:
          type: string
          format: date-time
          nullable: true
          description: 원본 파기 기한(완료/실패 후 최대 24시간). 종료 전 null.
        result_expires_at:
          type: string
          format: date-time
          nullable: true
          description: 결과 다운로드 만료 시각. done/expired 이외에는 null.
        failure:
          type: object
          nullable: true
          description: failed에서만 오류 객체, 그 외 null. 내부 경로/워커 주소/민감 데이터 미포함.
          required: [code, message]
          properties:
            code:
              type: string
              enum: [processing_failed, storage_failed]
            message:
              type: string
      example:
        job_id: 8f46f610-3207-4b86-8a22-18a1eeefb781
        status: paused
        progress: 37
        queue_position: 1
        eta_sec: null
        created_at: '2026-10-26T08:00:00Z'
        updated_at: '2026-10-26T08:10:00Z'
        completed_at: null
        original_delete_at: null
        result_expires_at: null
        failure: null
    VodJobList:
      type: object
      required: [jobs, next_cursor]
      properties:
        jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/VodJob'
        next_cursor:
          type: string
          minLength: 1
          nullable: true
          description: 다음 페이지 opaque cursor. 마지막 페이지에서는 null.
      example:
        jobs: []
        next_cursor: null
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 응답별 description에 정의한 안정적인 오류 코드
            message:
              type: string
              description: 사용자 표시용 설명. 문자열 비교로 분기하지 않는다.
            details:
              type: object
              additionalProperties: true
        request_id:
          type: string
          description: 서버 writeError에서 제공. 인증 미들웨어 등에서는 생략 가능.
      example:
        error:
          code: upload_too_large
          message: Video exceeds the configured upload limit.
          details:
            max_upload_bytes: 1073741824
            max_request_bytes: 1074790400
        request_id: 5ac51bac-c82d-41fa-9dc7-dce292abf593
  responses:
    Job:
      description: 작업 상세
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VodJob'
    BadRequest:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: bad_request — 잘못된 UUID/쿼리/multipart, 빈 파일 또는 file 파트 개수 오류.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: unauthorized — 토큰 누락/무효/만료 또는 비활성 사용자. 기존 인증 오류 사용.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ForbiddenOrigin:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: origin_not_allowed — 허용되지 않은 Origin. 타인 작업에 사용하는 상태 코드가 아님.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: not_found — 없는 작업, 삭제한 작업, 타인 작업 모두 동일한 코드/메시지. 소유자 정보 미포함.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    WithdrawalInProgress:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: withdrawal_in_progress — 계정 탈퇴 중 작업 변경 차단. 기존 사용자 작업 게이트 재사용.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UploadTooLarge:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: |
        upload_too_large — 파일 크기 또는 전체 요청 본문 상한 초과.
        details.max_upload_bytes와 details.max_request_bytes에 적용 상한 제공.
        예시의 수치는 운영 기본값이 아니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMedia:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: unsupported_media_type — multipart가 아닌 요청, 미지원 파일 MIME/컨테이너/코덱.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidMedia:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: |
        invalid_media — 손상 파일, 영상 트랙 부재, 길이를 조사할 수 없거나 길이 <= 0.
        duration_exceeded — 영상 길이 상한 초과. details.max_duration_sec에 적용 상한 제공.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResultNotReady:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: result_not_ready — uploaded/queued/processing/paused/failed/cancelled 작업에 결과 요청.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ResultExpired:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: result_expired — 결과 보존 기한 경과. 작업 상세는 계속 200으로 조회 가능.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: rate_limited — 요청 빈도 제한. Retry-After 초 이후 재시도. 구체적 제한량은 운영 정책.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      description: internal_error — 예상하지 못한 서버 오류 또는 기존 인증 저장소 오류.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: |
        service_unavailable — 작업 저장소/파일 저장소 등 일시적 장애.
        demo_lockdown — 기존 RequireUser 시연 제한 정책. 라이브 자원 점유 자체는 503 사유가 아님.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
