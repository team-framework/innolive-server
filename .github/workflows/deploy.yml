# main 머지 시 GPU 프로덕션 서버로 자동 배포하는 워크플로.
# 공개 레포이므로 이 로그는 전 세계에 공개된다 — 서버 정보는 전부 Secrets로만 다루고
# (자동 마스킹), 상세 진단은 서버 로컬 로그에만 남긴다(deploy/README.md 로그 위생 참조).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      force_restart:
        description: "활성 방송 세션이 있어도 강제 재시작 (방송이 끊김 — 긴급시에만)"
        type: boolean
        default: false

permissions:
  contents: read

# 배포는 직렬화한다 — 진행 중인 배포·롤백 위로 새 배포가 끼어들지 않게 한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/innolive-server:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/innolive-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 서버의 forced command가 "deploy <sha> [--force]"만 받는다. 서버 스크립트의
      # stdout(단계 키워드만 출력하는 계약)이 이 스텝의 로그가 되고, exit code가 배포 결과다.
      - name: Deploy to production
        run: |
          FORCE=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_restart }}" = "true" ]; then
            FORCE=" --force"
          fi
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o LogLevel=ERROR \
            -o ConnectTimeout=15 \
            -p "${{ secrets.DEPLOY_SSH_PORT }}" \
            "deploy@${{ secrets.DEPLOY_SSH_HOST }}" \
            "deploy ${{ github.sha }}${FORCE}"
