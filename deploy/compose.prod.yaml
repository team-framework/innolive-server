# GPU 프로덕션 서버용 compose. /opt/innolive/compose.prod.yaml 로 설치해 사용한다.
# 이미지 경로·태그는 systemd 유닛이 EnvironmentFile(/etc/innolive/deploy.env,
# /opt/innolive/deploy/current_tag-<slot>)로 주입한다 — 이 파일에는 계정명·태그를 하드코딩하지 않는다.
#
# 무중단 배포(#517): 같은 파일로 슬롯 두 개(blue·green)를 띄운다. 슬롯은
# innolive-server@<slot>.service가 INNOLIVE_SLOT으로 정하고, 포트(HTTP_ADDR,
# WEBRTC_UDP_MUX_PORT, AI_CONTROL_ADDR)는 /etc/innolive/server-slot-<slot>.env가
# server.env를 덮어 정한다. 배포 때 새 슬롯을 띄우고 세션을 넘긴 뒤 옛 슬롯을 멈춘다.
#
# 주의: `docker compose config`는 env_file의 시크릿을 평문으로 병합해 출력하므로
# 배포 스크립트·워크플로 어디에서도 실행하지 말 것(수동 디버깅 시에도 터미널에서만).
name: innolive-${INNOLIVE_SLOT:?set by innolive-server@<slot>.service}

services:
  server:
    image: "${INNOLIVE_IMAGE:?set in /etc/innolive/deploy.env}:${INNOLIVE_TAG:?set in /opt/innolive/deploy/current_tag}"
    container_name: innolive-server-${INNOLIVE_SLOT}
    # host 네트워크: WebRTC UDP mux(50001)·AI gRPC(127.0.0.1:5005x)·Postgres/Redis(localhost)
    # 접근을 한 번에 해결한다. 포트 매핑은 사용하지 않는다.
    network_mode: host
    # NVENC 인코딩용 GPU 노출. nvidia 런타임이 libcuda/libnvidia-encode를
    # 컨테이너에 주입한다 - 없으면 h264_nvenc가 libcuda.so.1에서 실패한다.
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    env_file:
      - /etc/innolive/server.env
      - /etc/innolive/server-secrets.env
      # 슬롯별 포트. 뒤에 오는 파일이 앞의 값을 덮는다.
      - /etc/innolive/server-slot-${INNOLIVE_SLOT}.env
    volumes:
      # 참조 얼굴 저장소(REFERENCE_STORE_PATH)
      - /var/lib/innolive:/var/lib/innolive
      # VOD 공유 저장소(VOD_ROOT). AI 워커 유닛의 ReadWritePaths(/var/lib/innolive-ai) 안이며
      # 워커와 같은 절대 경로여야 한다. 권한은 api/vod/DEPLOY.md의 ACL 절차를 따른다.
      - /var/lib/innolive-ai/vod:/var/lib/innolive-ai/vod
      # Apple 로그인 개인키(.p8). 컨테이너 내 경로가 server-secrets.env 의
      # APPLE_PRIVATE_KEY_PATH 와 일치해야 하므로 호스트 경로를 그대로 마운트한다.
      - "${INNOLIVE_APPLE_KEY_PATH:-/dev/null}:${INNOLIVE_APPLE_KEY_PATH:-/dev/null}:ro"
    # 재시작 정책은 systemd(innolive-server.service)가 관리한다.
    restart: "no"
