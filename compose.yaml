services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      AUTH_ACCESS_TOKEN_KEY_BASE64: "${AUTH_ACCESS_TOKEN_KEY_BASE64}"
      AUTH_ACCESS_TOKEN_TTL: "${AUTH_ACCESS_TOKEN_TTL:-15m}"
      AUTH_REFRESH_TOKEN_TTL: "${AUTH_REFRESH_TOKEN_TTL:-720h}"
      AUTH_REFRESH_TOKEN_ABSOLUTE_TTL: "${AUTH_REFRESH_TOKEN_ABSOLUTE_TTL:-2160h}"
      AUTH_TOKEN_ISSUER: "${AUTH_TOKEN_ISSUER:-innolive-server}"
      AUTH_TOKEN_AUDIENCE: "${AUTH_TOKEN_AUDIENCE:-innolive-api}"
      AUTH_TOKEN_CLOCK_SKEW: "${AUTH_TOKEN_CLOCK_SKEW:-30s}"
      AUTH_CORS_ALLOW_ALL_ORIGINS: "${AUTH_CORS_ALLOW_ALL_ORIGINS:-false}"
      AUTH_CORS_ALLOWED_ORIGINS: "${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}"
      HTTP_ADDR: ":8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      DATABASE_URL: >-
        postgres://${POSTGRES_USER:-innolive}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-innolive}?sslmode=disable
      DATABASE_MIGRATION_MODE: "${DATABASE_MIGRATION_MODE:-versioned}"
      DATABASE_MAX_OPEN_CONNS: "${DATABASE_MAX_OPEN_CONNS:-10}"
      DATABASE_MAX_IDLE_CONNS: "${DATABASE_MAX_IDLE_CONNS:-5}"
      DATABASE_CONN_MAX_LIFETIME: "${DATABASE_CONN_MAX_LIFETIME:-30m}"
      DATABASE_CONN_MAX_IDLE_TIME: "${DATABASE_CONN_MAX_IDLE_TIME:-5m}"

      AI_PRIVACY_MODE: "${AI_PRIVACY_MODE:-bypass}"
      AI_GRPC_ADDR: "${AI_GRPC_ADDR:-host.docker.internal:50051}"
      AI_GRPC_TARGETS: "${AI_GRPC_TARGETS:-host.docker.internal:50051}"
      AI_GRPC_INSECURE: "${AI_GRPC_INSECURE:-true}"
      AI_GRPC_TIMEOUT: "${AI_GRPC_TIMEOUT:-5s}"
      AI_FRAME_WIRE_FORMAT: "${AI_FRAME_WIRE_FORMAT:-jpeg}"
      AI_FRAME_QUEUE_SIZE: "${AI_FRAME_QUEUE_SIZE:-2}"
      AI_FAILURE_POLICY: "${AI_FAILURE_POLICY:-blackout_latch}"
      AI_TIMEOUT_LATCH_THRESHOLD: "${AI_TIMEOUT_LATCH_THRESHOLD:-3}"
      AI_PREFLIGHT_TIMEOUT: "${AI_PREFLIGHT_TIMEOUT:-30s}"
      AI_PREFLIGHT_REQUIRED: "${AI_PREFLIGHT_REQUIRED:-false}"
      AI_PRIVACY_FIXED_DELAY: "${AI_PRIVACY_FIXED_DELAY:-20ms}"
      AI_PRIVACY_ME_IMAGE_PATH: "${AI_PRIVACY_ME_IMAGE_PATH:-}"
      REFERENCE_STORE_PATH: "${REFERENCE_STORE_PATH:-}"

      FFMPEG_PATH: "${FFMPEG_PATH:-ffmpeg}"
      FFMPEG_SPAWN_CONCURRENCY: "${FFMPEG_SPAWN_CONCURRENCY:-3}"
      FFMPEG_ENCODER_THREADS: "${FFMPEG_ENCODER_THREADS:-1}"

      MAX_SESSIONS: "${MAX_SESSIONS:-0}"
      SESSION_NEGOTIATION_TIMEOUT: "${SESSION_NEGOTIATION_TIMEOUT:-30s}"
      INNOLIVE_REQUIRE_SESSION_AUTH: "${INNOLIVE_REQUIRE_SESSION_AUTH:-true}"

      WEBRTC_STUN_URLS: "${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}"
      WEBRTC_TURN_URLS: "${WEBRTC_TURN_URLS:-}"
      WEBRTC_TURN_USERNAME: "${WEBRTC_TURN_USERNAME:-}"
      WEBRTC_TURN_CREDENTIAL: "${WEBRTC_TURN_CREDENTIAL:-}"
      WEBRTC_ANNOUNCED_IP: "${WEBRTC_ANNOUNCED_IP:-}"
      WEBRTC_UDP_MUX_PORT: "0"
      WEBRTC_UDP_PORT_MIN: "${WEBRTC_UDP_PORT_MIN:-50002}"
      WEBRTC_UDP_PORT_MAX: "${WEBRTC_UDP_PORT_MAX:-50020}"
      WEBRTC_DISCONNECTED_GRACE: "${WEBRTC_DISCONNECTED_GRACE:-10s}"

      YOUTUBE_STREAM_KEY: "${YOUTUBE_STREAM_KEY:-}"
      ENABLE_AUDIO_EGRESS: "${ENABLE_AUDIO_EGRESS:-false}"
      EGRESS_LATENCY_LOG: "${EGRESS_LATENCY_LOG:-false}"
      EGRESS_AUDIO_OFFSET_MS: "${EGRESS_AUDIO_OFFSET_MS:-0}"

      GOOGLE_OAUTH_WEB_CLIENT_ID: "${GOOGLE_OAUTH_WEB_CLIENT_ID:-}"
      APPLE_TEAM_ID: "${APPLE_TEAM_ID:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_KEY_ID: "${APPLE_KEY_ID:-}"
      APPLE_PRIVATE_KEY_PATH: "${APPLE_PRIVATE_KEY_PATH:-}"
      AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY_BASE64: "${AUTH_PROVIDER_TOKEN_ENCRYPTION_KEY_BASE64:-}"

    # Apple OAuth를 쓸 때 host의 .p8 파일을 컨테이너 안의 동일 경로로 read-only mount한다.
    # 비활성 상태에서는 /dev/null을 mount하므로 compose 환경에서도 Apple 설정 없이 기동할 수 있다.
    volumes:
      - "${APPLE_PRIVATE_KEY_PATH:-/dev/null}:${APPLE_PRIVATE_KEY_PATH:-/dev/null}:ro"

    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${WEBRTC_UDP_PORT_MIN:-50002}-${WEBRTC_UDP_PORT_MAX:-50020}:${WEBRTC_UDP_PORT_MIN:-50002}-${WEBRTC_UDP_PORT_MAX:-50020}/udp"

    depends_on:
      postgres:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-innolive}"
      POSTGRES_USER: "${POSTGRES_USER:-innolive}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-innolive} -d ${POSTGRES_DB:-innolive}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
