name: CI (skip)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 코드 변경 없음 — CI 생략
        run: echo "Go 코드·의존성 변경이 없어 빌드와 테스트를 건너뜁니다."
