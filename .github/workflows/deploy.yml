name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      force_restart:
        description: "활성 방송 세션이 있어도 강제 재시작 (방송이 끊김 — 긴급시에만)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/innolive-server:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/innolive-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          FORCE=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_restart }}" = "true" ]; then
            FORCE=" --force"
          fi
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o LogLevel=ERROR \
            -o ConnectTimeout=15 \
            -p "${{ secrets.DEPLOY_SSH_PORT }}" \
            "deploy@${{ secrets.DEPLOY_SSH_HOST }}" \
            "deploy ${{ github.sha }}${FORCE}"
