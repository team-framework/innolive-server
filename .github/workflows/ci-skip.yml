name: CI (skip)

# ci.yml 은 paths 필터로 코드가 바뀐 PR에서만 돈다. 그런데 main 브랜치 보호는
# build-and-test 를 필수 체크로 요구하므로, 코드 외 파일만 바꾼 PR은 체크가
# 영원히 보고되지 않아 pending 상태로 막힌다.
#
# 이 워크플로는 ci.yml 의 paths 를 그대로 뒤집은 paths-ignore 로 동작한다.
# 둘 중 정확히 하나만 실행되며, 어느 쪽이든 같은 이름의 build-and-test 체크를
# 보고하므로 필수 체크가 항상 채워진다.
#
# ⚠️ ci.yml 의 paths 를 고치면 이 파일의 paths-ignore 도 같이 고쳐야 한다.
#    둘이 어긋나면 두 워크플로가 함께 돌거나(중복 체크) 둘 다 건너뛴다(다시 pending).

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'api/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-skip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: 코드 변경 없음 — CI 생략
        run: echo "Go 코드·의존성 변경이 없어 빌드와 테스트를 건너뜁니다."
