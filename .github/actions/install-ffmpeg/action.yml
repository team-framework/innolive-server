name: Install ffmpeg
description: >-
  media 계열 테스트가 실제로 돌도록 ffmpeg를 설치한다. 러너의 apt 미러가
  느려지면 설치가 멈춘 것처럼 길어져 테스트에 쓸 시간 예산을 잠식하므로,
  시도마다 시간을 끊고 재시도한다.

runs:
  using: composite
  steps:
    - name: Install ffmpeg (bounded retry)
      shell: bash
      run: |
        set -uo pipefail

        ATTEMPT_TIMEOUT=180
        ATTEMPTS=3

        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "ffmpeg가 이미 있어 설치를 건너뜁니다 — $(ffmpeg -version | head -1)"
          exit 0
        fi

        for attempt in $(seq 1 "${ATTEMPTS}"); do
          echo "::group::ffmpeg 설치 시도 ${attempt}/${ATTEMPTS} (상한 ${ATTEMPT_TIMEOUT}초)"
          started=${SECONDS}

          status=0
          sudo timeout "${ATTEMPT_TIMEOUT}" apt-get update -qq || status=$?
          if [ "${status}" -eq 0 ]; then
            sudo timeout "${ATTEMPT_TIMEOUT}" apt-get install -y -qq ffmpeg || status=$?
          fi

          elapsed=$((SECONDS - started))
          echo "::endgroup::"

          if [ "${status}" -eq 0 ]; then
            echo "ffmpeg 설치 완료 — ${attempt}회차, ${elapsed}초"
            ffmpeg -version | head -1
            exit 0
          fi

          if [ "${status}" -eq 124 ]; then
            echo "::warning::ffmpeg 설치가 ${attempt}회차에서 ${ATTEMPT_TIMEOUT}초를 넘겨 중단됐습니다(러너 apt 미러 지연으로 추정)."
          else
            echo "::warning::ffmpeg 설치가 ${attempt}회차에서 실패했습니다(exit ${status}, ${elapsed}초)."
          fi

          sudo pkill -TERM -x apt-get >/dev/null 2>&1 || true
          sleep 2
          sudo pkill -KILL -x apt-get >/dev/null 2>&1 || true
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sleep $((attempt * 5))
        done

        echo "::error::ffmpeg 설치가 ${ATTEMPTS}회 모두 실패했습니다. 러너 apt 미러 상태를 확인하세요."
        exit 1
