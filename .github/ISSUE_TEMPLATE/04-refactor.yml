name: 리팩터링 (refactor)
description: 동작을 유지하는 구조 개선 작업 등록
title: "refactor: "
labels: ["refactor"]

body:
  - type: markdown
    attributes:
      value: |
        담당자 지정. 한 항목에 한 가지 내용, 명사형 종결의 개조식 작성.
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 해결할 문제 또는 추가할 기능
      placeholder: "- 카메라 중복 세션 생성 차단"
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 작업 체크리스트
      description: 실제 작업·검증 항목 작성, 수행 후 체크
      value: |
        - [ ] 구현 항목
        - [ ] 변경 범위에 맞는 검증
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 완료 여부를 확인할 수 있는 동작 또는 결과
      placeholder: "- 반복 진입 시 카메라 정상 동작"
    validations:
      required: true
