name: Install ffmpeg
description: >-
  media 계열 테스트가 실제로 돌도록 ffmpeg를 설치한다. 러너의 apt 미러가
  느려지면 설치가 멈춘 것처럼 길어져 테스트에 쓸 시간 예산을 잠식하므로,
  시도마다 시간을 끊고 재시도한다.

runs:
  using: composite
  steps:
    - name: Install ffmpeg (bounded retry)
      shell: bash
      run: |
        # composite action의 `shell: bash`는 `--noprofile --norc -e -o pipefail`로
        # 실행된다. 여기서 -e를 전역으로 끄면 스크립트의 다른 실패가 조용히
        # 지나가므로, 실패를 허용해야 하는 호출만 아래에서 `|| status=$?`로 받는다.
        set -uo pipefail

        # 시도 1회 상한. 정상 설치는 1~2분대라 3분이면 넉넉하고, 미러가 멈춘
        # 경우는 여기서 끊어 다음 시도로 넘긴다(다른 미러가 잡힐 수 있다).
        ATTEMPT_TIMEOUT=180
        ATTEMPTS=3

        # 러너 이미지에 이미 있으면 받지 않는다. 현재 ubuntu-latest에는 없지만
        # 나중에 포함되면 이 스텝이 그대로 몇 초로 줄어든다.
        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          echo "ffmpeg가 이미 있어 설치를 건너뜁니다 — $(ffmpeg -version | head -1)"
          exit 0
        fi

        for attempt in $(seq 1 "${ATTEMPTS}"); do
          echo "::group::ffmpeg 설치 시도 ${attempt}/${ATTEMPTS} (상한 ${ATTEMPT_TIMEOUT}초)"
          started=${SECONDS}

          # timeout이 apt-get의 '직접' 부모여야 한다. 사이에 sudo나 bash -c를
          # 끼우면 timeout은 그 껍데기만 죽이고 손자인 apt-get이 살아남아
          # /var/lib/apt/lists/lock을 쥔 채로 남는다 — 그러면 다음 시도가
          # "Could not get lock"으로 즉시 실패해 재시도가 무의미해진다(#132).
          # `|| status=$?`가 없으면 -e가 여기서 스크립트를 죽인다.
          status=0
          sudo timeout "${ATTEMPT_TIMEOUT}" apt-get update -qq || status=$?
          if [ "${status}" -eq 0 ]; then
            sudo timeout "${ATTEMPT_TIMEOUT}" apt-get install -y -qq ffmpeg || status=$?
          fi

          elapsed=$((SECONDS - started))
          echo "::endgroup::"

          if [ "${status}" -eq 0 ]; then
            echo "ffmpeg 설치 완료 — ${attempt}회차, ${elapsed}초"
            ffmpeg -version | head -1
            exit 0
          fi

          if [ "${status}" -eq 124 ]; then
            echo "::warning::ffmpeg 설치가 ${attempt}회차에서 ${ATTEMPT_TIMEOUT}초를 넘겨 중단됐습니다(러너 apt 미러 지연으로 추정)."
          else
            echo "::warning::ffmpeg 설치가 ${attempt}회차에서 실패했습니다(exit ${status}, ${elapsed}초)."
          fi

          # 그래도 남은 apt 프로세스가 있으면 락이 풀리지 않는다. 러너는 일회용이라
          # 남은 것을 정리해도 잃을 게 없다. 이어서 dpkg 중간 상태도 복구한다 —
          # 정리하지 않으면 다음 시도가 "dpkg was interrupted"로 바로 실패한다.
          sudo pkill -TERM -x apt-get >/dev/null 2>&1 || true
          sleep 2
          sudo pkill -KILL -x apt-get >/dev/null 2>&1 || true
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sleep $((attempt * 5))
        done

        echo "::error::ffmpeg 설치가 ${ATTEMPTS}회 모두 실패했습니다. 러너 apt 미러 상태를 확인하세요."
        exit 1
