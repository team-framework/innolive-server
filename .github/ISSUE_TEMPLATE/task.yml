name: 작업 이슈
description: Framework의 작업을 등록해요.
title: ""
labels: ["작업"]
body:
  - type: markdown
    attributes:
      value: |
        제목에는 작업 내용을 한국어로 적어 주세요. 또한 생성 후 5시간 안에 이슈 번호를 포함한 브랜치를 만들어 주세요.
  - type: dropdown
    id: type
    attributes:
      label: 작업 유형
      description: 브랜치와 PR에도 같은 유형을 사용해 주세요.
      options: [feat, fix, refactor, hotfix, docs, style, remove, delete, test, chore, comment]
    validations:
      required: true
  - type: dropdown
    id: assignee
    attributes:
      label: 담당자
      options: [chaeyn, itzjb, Finefinee, hjbin-25, daehyeong2, jdw09]
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: 마감일
      placeholder: "2026-08-05 18:00"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 작업 목표
    validations:
      required: true
